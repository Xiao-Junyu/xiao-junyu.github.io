<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1117">
  <meta name="description" content="胸部 CT 影像查看器">
  <title>胸部 CT 影像</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">CHEST CT VIEWER</p>
      <h1>胸部影像浏览</h1>
    </div>
    <div class="status"><span class="status-dot"></span><span id="statusText">准备中</span></div>
  </header>

  <main class="layout">
    <section class="viewer-card" aria-label="影像查看区">
      <div class="viewer" id="viewer" tabindex="0">
        <img id="scanImage" alt="胸部 CT 切片">
        <div class="image-badge" id="imageBadge">1 / 1</div>
        <div class="wheel-hint">滚轮切换图片</div>
      </div>
      <div class="transport">
        <button class="icon-button" id="previous" type="button" aria-label="上一张">←</button>
        <input id="progress" type="range" min="0" max="0" value="0" aria-label="切片进度">
        <button class="icon-button" id="next" type="button" aria-label="下一张">→</button>
      </div>
    </section>

    <aside class="control-card">
      <div class="control-group">
        <label for="studySelect">检查日期</label>
        <select id="studySelect"></select>
      </div>
      <div class="control-group">
        <label for="seriesSelect">影像序列</label>
        <select id="seriesSelect"></select>
      </div>
      <div class="slice-readout">
        <span>当前切片</span>
        <strong id="sliceReadout">1 / 1</strong>
      </div>
      <div class="help">
        <p><b>桌面端</b>：鼠标滚轮切换，或使用 ← → 方向键。</p>
        <p><b>手机端</b>：左右滑动，或拖动下方进度条。</p>
      </div>
      <p class="privacy-note">仅包含 JPG 预览图，不包含原始 DICOM、患者 XML 或阅读器文件。</p>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
